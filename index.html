<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Divine Visitation, Deliverance, and Family Prayer · Dominion Hour with Prophet Prince Amo David</title>
<meta name="description" content="Dominion Hour with Prophet Prince Amo David. Interactive study of the October 16, 2026 prophetic intercession service, hosted by L137 Deliverance Ministry International: divine visitation, deliverance, and family prayer. KJV Scripture, guided audio, declarations, quizzes.">
<meta name="theme-color" content="#0B1E4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header class="topbar" id="topbar">
  <button class="tb-btn" id="btnHome" aria-label="Home">⌂ <span>Home</span></button>
  <div class="tb-title" id="tbTitle">Welcome</div>
  <div class="tb-tools">
    <button class="tb-btn sm" id="btnFontDown" aria-label="Smaller text">A−</button>
    <button class="tb-btn sm" id="btnFontUp" aria-label="Larger text">A+</button>
    <button class="tb-btn sm" id="btnTheme" aria-label="Switch day or night mode">Night</button>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<div class="audiobar" id="audiobar" hidden>
  <div class="ab-status" id="abStatus" aria-live="polite">Ready</div>
  <div class="ab-row">
    <button class="ab-btn" id="abBack" aria-label="Back one part">◀◀<small>Back</small></button>
    <button class="ab-btn" id="abStop" aria-label="Stop">■<small>Stop</small></button>
    <button class="ab-main" id="abPlay" aria-label="Play">
      <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="trk" cx="32" cy="32" r="29"/><circle class="bar" id="abRing" cx="32" cy="32" r="29"/></svg>
      <span class="ab-in"><span id="abIcon">▶</span><small id="abLbl">Play</small></span>
    </button>
    <button class="ab-btn" id="abFwd" aria-label="Forward one part">▶▶<small>Forward</small></button>
    <button class="ab-btn" id="abRepeat" aria-label="Replay this step">⟲<small>Replay</small></button>
  </div>
  <div class="ab-row opts">
    <label class="ab-opt">Speed
      <select id="abRate"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>
    </label>
    <label class="ab-opt"><input type="checkbox" id="abAuto"> Auto-advance</label>
    <label class="ab-opt"><input type="checkbox" id="abRepeatMode" checked> Repeat pauses</label>
  </div>
</div>
<script src="data.js?v=4"></script>
<script src="audio.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
